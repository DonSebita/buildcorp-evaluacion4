# Nginx de la EC2 backend (plantilla). setup_backend.sh reemplaza __ORIGIN_SECRET__
# y la instala en /etc/nginx/sites-available/buildcorp-backend (permiso 640, solo root).
#
# Regla clave: /api/ y /admin/ solo responden si la petición trae la cabecera
# X-Origin-Verify con el secreto que agrega API Gateway. Así nadie puede saltarse
# el rate limit llamando directo a la IP de la EC2 (responde 403).
# /admin/ además se permite desde la propia máquina (túnel SSH, ver README).

# Respeta el esquema que informa API Gateway (https); si no viene, usa el de Nginx
map $http_x_forwarded_proto $buildcorp_proto {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 10M;   # fotos de activos y firmas

    # Cabeceras de seguridad (se heredan en las location que no usan add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Parámetros comunes hacia Gunicorn
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $buildcorp_proto;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Origin-Verify "";   # el secreto no llega a Django ni a los logs de la app
    proxy_read_timeout 60s;

    location /api/ {
        if ($http_x_origin_verify != "__ORIGIN_SECRET__") {
            return 403;
        }
        proxy_pass http://127.0.0.1:8000;
    }

    location /admin/ {
        set $buildcorp_admin_ok 0;
        if ($http_x_origin_verify = "__ORIGIN_SECRET__") {
            set $buildcorp_admin_ok 1;
        }
        if ($remote_addr = "127.0.0.1") {   # túnel SSH: ssh -L 8080:localhost:80 ...
            set $buildcorp_admin_ok 1;
        }
        if ($buildcorp_admin_ok = 0) {
            return 403;
        }
        proxy_pass http://127.0.0.1:8000;
    }

    # Estáticos y media locales (solo se usan si USE_S3=False; con S3 los sirve el bucket)
    location /static/ {
        alias /home/ubuntu/BuildCorp/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /home/ubuntu/BuildCorp/media/;
    }

    # No servir archivos ocultos (.env, .git, etc.) aunque alguien cambie un alias
    location ~ /\. {
        return 404;
    }

    # Interfaz Django Templates (respaldo de la Evaluación 3)
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
