# Nginx de la EC2 frontend (plantilla). setup_frontend.sh reemplaza __API_ORIGIN__ (origen de
# API Gateway, p. ej. https://abc123.execute-api.us-east-1.amazonaws.com) y __S3_REGION__,
# y la instala en /etc/nginx/sites-available/buildcorp-frontend.
#
# Sirve el build de Vite (dist/) copiado en /var/www/buildcorp. El navegador solo puede
# hacer fetch a la propia página y a API Gateway (connect-src), nunca directo a la EC2 backend.
# HTTPS: setup_frontend.sh corre certbot --nginx (Let's Encrypt) si recibe un dominio; certbot
# agrega el "listen 443 ssl" a este mismo server y la redirección 80 -> 443.

# HTML (index.html y rutas del SPA): nunca en caché, para que un build nuevo se vea al recargar.
# El resto no recibe Cache-Control desde aquí (/assets/ usa expires).
map $sent_http_content_type $buildcorp_cache_control {
    ~^text/html  "no-cache, no-store, must-revalidate";
    default      "";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/buildcorp;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Cabeceras de seguridad. Ninguna location usa add_header, así que todas las heredan.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS (hallazgo ZAP): el navegador recuerda usar solo HTTPS por 1 año. Sobre HTTP se ignora.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $buildcorp_cache_control always;
    # CSP: scripts y estilos solo propios (sin 'unsafe-inline', hallazgo ZAP). La tipografía
    # Archivo viene empaquetada en el build (@fontsource), y React aplica la prop style por
    # CSSOM, que la CSP no bloquea. Imágenes: S3 prefirmadas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://*.s3.amazonaws.com https://*.s3.__S3_REGION__.amazonaws.com; connect-src 'self' __API_ORIGIN__; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash generados por Vite: caché larga (cambian de nombre en cada build)
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # No servir archivos ocultos
    location ~ /\. {
        return 404;
    }

    # Rutas del SPA (react-router): todo lo que no sea un archivo cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
